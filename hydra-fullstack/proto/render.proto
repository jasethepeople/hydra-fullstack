syntax = "proto3";

package hydra;
option go_package = "hydra-fullstack/internal/grpcapi";

// RenderService handles distributed rendering jobs
service RenderService {
  rpc SubmitRender (RenderRequest) returns (RenderResponse);
  rpc GetJobStatus (JobStatusRequest) returns (JobStatusResponse);
  rpc StreamJobLogs (JobLogsRequest) returns (stream LogEntry);
  rpc GetWorkerStats (WorkerStatsRequest) returns (WorkerStatsResponse);
  rpc HealthCheck (HealthRequest) returns (HealthResponse);
}

// AlertService handles alert management
service AlertService {
  rpc FireAlert (AlertRequest) returns (AlertResponse);
  rpc GetActiveAlerts (ActiveAlertsRequest) returns (ActiveAlertsResponse);
  rpc AcknowledgeAlert (AcknowledgeRequest) returns (AcknowledgeResponse);
  rpc GetAlertHistory (AlertHistoryRequest) returns (AlertHistoryResponse);
  rpc StreamAlerts (StreamAlertsRequest) returns (stream AlertEvent);
}

message RenderRequest {
  int32 width = 1;
  int32 height = 2;
  string complexity = 3;
  int32 iterations = 4;
  int32 priority = 5;
  string payload = 6;
}

message RenderResponse {
  string job_id = 1;
  string status = 2;
  int64 queue_position = 3;
  string estimated_wait = 4;
}

message JobStatusRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;
  int32 progress = 3;
  string worker_id = 4;
  int64 duration_ms = 5;
  string error_message = 6;
  string created_at = 7;
  string completed_at = 8;
}

message JobLogsRequest {
  string job_id = 1;
  bool follow = 2;
}

message LogEntry {
  string timestamp = 1;
  string level = 2;
  string message = 3;
  map<string, string> metadata = 4;
}

message WorkerStatsRequest {}

message WorkerStatsResponse {
  int32 total_workers = 1;
  int32 active_workers = 2;
  int32 busy_workers = 3;
  int32 idle_workers = 4;
  int64 queue_depth = 5;
  int64 dead_letter_count = 6;
  repeated CircuitBreakerStats circuit_breakers = 7;
}

message CircuitBreakerStats {
  string service_name = 1;
  string state = 2;
  int32 failure_count = 3;
  int32 success_count = 4;
  string last_failure = 5;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
  map<string, string> checks = 3;
  string timestamp = 4;
}

message AlertRequest {
  string alert_type = 1;
  string severity = 2;
  string category = 3;
  string message = 4;
  double value = 5;
  double threshold = 6;
  string unit = 7;
}

message AlertResponse {
  string alert_id = 1;
  bool dispatched = 2;
  repeated string channels = 3;
}

message ActiveAlertsRequest {}

message ActiveAlertsResponse {
  repeated Alert alerts = 1;
  int32 count = 2;
}

message Alert {
  string id = 1;
  string alert_type = 2;
  string severity = 3;
  string category = 4;
  string message = 5;
  double value = 6;
  double threshold = 7;
  string unit = 8;
  string timestamp = 9;
  bool acknowledged = 10;
  string acked_by = 11;
  string acked_at = 12;
}

message AcknowledgeRequest {
  string alert_id = 1;
  string acked_by = 2;
}

message AcknowledgeResponse {
  bool success = 1;
  string alert_id = 2;
  string timestamp = 3;
}

message AlertHistoryRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message AlertHistoryResponse {
  repeated Alert alerts = 1;
  int32 count = 2;
  int32 total = 3;
}

message StreamAlertsRequest {
  string severity_filter = 1;
}

message AlertEvent {
  string event_type = 1;
  Alert alert = 2;
  string timestamp = 3;
}
